<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HSE ELECNOR</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --blue: #003366; --gray: #cbd5e0; --light-gray: #f0f2f5; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--light-gray); margin: 0; padding: 0; width: 100%; }
        
        .app-container { background: white; width: 100%; max-width: 800px; margin: 0 auto; min-height: 100vh; border: 1px solid #000; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
        
        input[type="time"], input[type="date"], select, input[type="text"], textarea { 
            font-size: 16px !important; padding: 12px; border-radius: 4px; border: 1px solid #ccc; width: 100%; background: #fff; appearance: none; -webkit-appearance: none; 
        }

        .header-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .header-table td { border: 1px solid #000; text-align: center; padding: 5px; font-weight: bold; font-size: 10px; }
        .logo-img { width: 60px; height: auto; }
        .tech-info { text-align: left !important; font-size: 7px !important; line-height: 1.2; }

        .section-header { background: var(--gray); border: 1px solid #000; padding: 10px; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .row { display: flex; border-bottom: 1px solid #000; width: 100%; flex-wrap: wrap; }
        .cell { border-right: 1px solid #000; padding: 10px; display: flex; flex-direction: column; flex: 1; min-width: 50%; }
        label { font-size: 9px; font-weight: bold; margin-bottom: 4px; color: var(--blue); }

        .media-actions { display: flex; gap: 10px; padding: 10px; background: #fff; }
        .btn-media { flex: 1; padding: 12px; border: 1px solid var(--blue); background: #f8f9fa; border-radius: 5px; font-weight: bold; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        
        #drawing-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 10000; flex-direction: column; }
        #canvas-paint { background: #fff; touch-action: none; flex-grow: 1; width: 100%; }
        .paint-controls { background: var(--blue); padding: 15px; display: flex; justify-content: space-around; }

        #preview { width: 100%; max-height: 350px; object-fit: contain; display: none; margin: 10px 0; border: 1px solid #000; }
        .btn-submit { background: var(--blue); color: white; border: none; padding: 20px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        #statusMsg { font-size: 13px; text-align: center; padding: 15px; font-weight: bold; }
        #syncBanner { background: #44bb44; color: white; text-align: center; font-size: 11px; padding: 8px; display: none; }
        
        @media (max-width: 480px) { .cell { min-width: 100%; border-right: none; } }
    </style>
</head>
<body>

<div id="syncBanner">🔄 Sincronizando reportes pendientes...</div>

<div class="app-container">
    <form id="hSEForm">
        <table class="header-table">
            <tr>
                <td style="width: 20%;"><img id="logoImg" src="logo-elecnor.png" class="logo-img"></td>
                <td style="width: 50%;">FORMULARIO NEARMISS<br>PROYECTO COPIAPÓ SOLAR</td>
                <td style="width: 30%;" class="tech-info">CÓDIGO: FT-PC-HSE-43<br> FECHA: 05/05/2026<br> PÁGINA: 1 DE 1 <br> REVISIÓN: 00</td>
            </tr>
        </table>
        
        <div class="section-header">1. CONTEXTO</div>
        <div class="row">
            <div class="cell"><label>FECHA:</label><input type="date" id="fecha" required></div>
            <div class="cell"><label>HORA:</label><input type="time" id="hora" required></div>
        </div>
        <div class="row">
            <div class="cell"><label>DEPARTAMENTO:</label>
                <select id="depto" required>
                    <option value="">SELECCIONE...</option>
                    <option value="ADMINISTRATIVO">ADMINISTRATIVO</option>
                    <option value="CALIDAD">CALIDAD</option>
                    <option value="CIVIL">CIVIL</option>
                    <option value="CORPORATIVO">CORPORATIVO</option>
                    <option value="ELÉCTRICA">ELÉCTRICA</option>
                    <option value="FLOTAS">FLOTAS</option>
                    <option value="H&S">H&S</option>
                    <option value="INFRAESTRUCTURA">INFRAESTRUCTURA</option>
                    <option value="INGENIERÍA">INGENIERÍA</option>
                    <option value="LOGÍSTICA">LOGÍSTICA</option>
                    <option value="MECÁNICA">MECÁNICA</option>
                    <option value="MEDIO AMBIENTE">MEDIO AMBIENTE</option>
                    <option value="OTROS">OTROS</option>
                    <option value="PLANIFICACIÓN">PLANIFICACIÓN</option>
                    <option value="RR. HH.">RR. HH.</option>
                    <option value="SUBCONTRATADA">SUBCONTRATADA</option>
                </select>
            </div>
        </div>

        <div class="section-header">2. DESCRIPCIÓN DO EVENTO</div>
        <div class="row"><div class="cell"><textarea id="desc" rows="4" placeholder="DESCRIBA LO SUCEDIDO..." required></textarea></div></div>

        <div class="section-header">3. REGISTRO FOTOGRÁFICO / DIBUJO</div>
        <div class="media-actions">
            <div class="btn-media" onclick="document.getElementById('foto').click()">📸 FOTO</div>
            <div class="btn-media" onclick="abrirDibujoBlanco()">🎨 DIBUJAR</div>
        </div>
        <input type="file" id="foto" accept="image/*" style="display:none;">
        <img id="preview" src="">

        <div class="section-header">4. IDENTIFICACIÓN</div>
        <div class="row">
            <div class="cell"><label>NOMBRE Y APELLIDO:</label><input type="text" id="relator" required></div>
            <div class="cell"><label>EMPRESA:</label><input type="text" id="empresa" required></div>
        </div>

        <div id="statusMsg"></div>
        <button type="submit" id="submitBtn" class="btn-submit">ENVIAR REPORTE</button>
    </form>
</div>

<div id="drawing-container">
    <div class="paint-controls">
        <button onclick="cerrarDibujo()" style="background:red; color:#fff; border:none; padding:10px; border-radius:5px;">CANCELAR</button>
        <button onclick="guardarDibujo()" style="background:green; color:#fff; border:none; padding:10px; border-radius:5px;">ACEPTAR</button>
    </div>
    <canvas id="canvas-paint"></canvas>
</div>

<script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwpvovV6jGu_7lazLY3HfvCaBxVPOUjtLKHNjmBuKEGyM5QIxrEIgeo9kq5DPZRyEePJg/exec';

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(e => console.log(e)); }

    async function syncQueue() {
        if (!navigator.onLine) return;
        let queue = JSON.parse(localStorage.getItem('hse_queue') || '[]');
        if (queue.length === 0) return;
        document.getElementById('syncBanner').style.display = 'block';
        for (let i = 0; i < queue.length; i++) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(queue[i]) });
                queue.splice(i, 1); i--;
                localStorage.setItem('hse_queue', JSON.stringify(queue));
            } catch (e) { console.log("Sync failed", e); }
        }
        document.getElementById('syncBanner').style.display = 'none';
    }
    window.addEventListener('online', syncQueue);
    setInterval(syncQueue, 30000);

    const form = document.getElementById('hSEForm');
    const preview = document.getElementById('preview');
    const canvas = document.getElementById('canvas-paint');
    const ctx = canvas.getContext('2d');
    let painting = false;

    document.getElementById('foto').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => { preview.src = ev.target.result; preview.style.display = 'block'; };
            reader.readAsDataURL(file);
        }
    });

    function abrirDibujoBlanco() {
        document.getElementById('drawing-container').style.display = 'flex';
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 80;
        ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "red"; ctx.lineWidth = 3; ctx.lineCap = "round";
    }

    function cerrarDibujo() { document.getElementById('drawing-container').style.display = 'none'; }
    function guardarDibujo() {
        preview.src = canvas.toDataURL('image/jpeg', 0.8);
        preview.style.display = 'block';
        cerrarDibujo();
    }

    function startDraw(e) { painting = true; draw(e); }
    function endDraw() { painting = false; ctx.beginPath(); }
    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
    }
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, {passive: false});
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, {passive: false});
    window.addEventListener('mouseup', endDraw);
    window.addEventListener('touchend', endDraw);

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusMsg');
        
        btn.disabled = true;
        status.style.display = "block"; status.style.color = "orange";
        status.innerText = "⏳ GENERANDO PDF...";

        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            // 1. CABEÇALHO
            doc.setLineWidth(0.3);
            doc.rect(10, 10, 190, 25); 
            doc.line(50, 10, 50, 35);
            doc.line(150, 10, 150, 35);
            
            doc.setFont("helvetica", "bold");
            doc.setFontSize(10);
            doc.text("FORMULARIO NEARMISS", 100, 20, { align: "center" });
            doc.text("PROYECTO COPIAPÓ SOLAR", 100, 27, { align: "center" });

            doc.setFontSize(7);
            doc.text("CÓDIGO: FT-PC-HSE-43", 152, 16);
            doc.text("FECHA: 05/05/2026", 152, 22);
            doc.text("PÁGINA: 1 DE 1", 152, 28);
            doc.text("REVISIÓN: 00", 152, 34);

            // 2. SEÇÃO 1: CONTEXTO
            doc.setFillColor(203, 213, 224); 
            doc.rect(10, 35, 190, 7, 'F');
            doc.rect(10, 35, 190, 7); 
            doc.setFontSize(8);
            doc.text("1. CONTEXTO", 12, 39.5);

            doc.rect(10, 42, 95, 12); 
            doc.rect(105, 42, 95, 12); 
            doc.setFontSize(6);
            doc.text("FECHA:", 11, 45);
            doc.text("HORA:", 106, 45);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text(document.getElementById('fecha').value, 11, 51);
            doc.text(document.getElementById('hora').value, 106, 51);

            doc.rect(10, 54, 190, 12);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(6);
            doc.text("DEPARTAMENTO:", 11, 57);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text(document.getElementById('depto').value, 11, 63);

            // 3. SEÇÃO 2: DESCRIÇÃO
            doc.setFillColor(203, 213, 224);
            doc.rect(10, 66, 190, 7, 'F');
            doc.rect(10, 66, 190, 7);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(8);
            doc.text("2. DESCRIPCIÓN DO EVENTO", 12, 70.5);

            doc.rect(10, 73, 190, 35);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            const descLines = doc.splitTextToSize(document.getElementById('desc').value, 180);
            doc.text(descLines, 11, 79);

            // 4. SEÇÃO 3: REGISTRO
            doc.setFillColor(203, 213, 224);
            doc.rect(10, 108, 190, 7, 'F');
            doc.rect(10, 108, 190, 7);
            doc.setFont("helvetica", "bold");
            doc.text("3. REGISTRO FOTOGRÁFICO / DIBUJO", 12, 112.5);

            doc.rect(10, 115, 190, 105);
            if(preview.src && preview.src.startsWith('data:image')) {
                doc.addImage(preview.src, 'JPEG', 15, 120, 180, 95);
            }

            // 5. SEÇÃO 4: IDENTIFICAÇÃO
            doc.setFillColor(203, 213, 224);
            doc.rect(10, 220, 190, 7, 'F');
            doc.rect(10, 220, 190, 7);
            doc.setFont("helvetica", "bold");
            doc.text("4. IDENTIFICACIÓN", 12, 224.5);

            doc.rect(10, 227, 95, 15); 
            doc.rect(105, 227, 95, 15); 
            doc.setFontSize(6);
            doc.text("NOMBRE Y APELLIDO:", 11, 230);
            doc.text("EMPRESA:", 106, 230);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text(document.getElementById('relator').value.toUpperCase(), 11, 238);
            doc.text(document.getElementById('empresa').value.toUpperCase(), 106, 238);

            const pdfBase64 = doc.output('datauristring').split(',')[1];
            const fileName = `${document.getElementById('relator').value.toUpperCase()}_REPORTE.pdf`;
            const payload = { name: fileName, bytes: pdfBase64 };

            if (navigator.onLine) {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                status.innerText = "✅ ENVIADO!";
            } else {
                let q = JSON.parse(localStorage.getItem('hse_queue') || '[]');
                q.push(payload); localStorage.setItem('hse_queue', JSON.stringify(q));
                status.innerText = "☁️ GUARDADO.";
            }

            doc.save(fileName);
            form.reset(); preview.style.display = 'none';
        } catch (err) {
            status.innerText = "❌ ERROR.";
        }
        btn.disabled = false;
        setTimeout(() => { status.style.display = 'none'; }, 4000);
    });
</script>
</body>
</html>
