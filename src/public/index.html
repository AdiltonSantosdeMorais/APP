<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HSE ELECNOR - PROYECTO COPIAPÓ SOLAR</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --blue: #003366; --gray: #cbd5e0; --light-gray: #f0f2f5; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: var(--light-gray); margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
        
        /* Ajuste Responsivo Android/iOS */
        input[type="time"], input[type="date"] {
            appearance: none;
            -webkit-appearance: none;
            min-height: 40px;
            background: #fff;
            border: 1px solid #ddd !important;
            padding: 8px !important;
            border-radius: 4px;
            width: 100%;
        }

        .app-container { background: white; width: 100%; max-width: 800px; margin: 0 auto; min-height: 100vh; border: 1px solid #000; display: flex; flex-direction: column; }
        .header-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .header-table td { border: 1px solid #000; text-align: center; padding: 5px; font-weight: bold; font-size: 10px; overflow: hidden; }
        .logo-img { width: 60px; height: auto; }
        .tech-info { text-align: left !important; font-size: 7px !important; line-height: 1.2; padding-left: 5px !important; }

        .section-header { background: var(--gray); border: 1px solid #000; padding: 10px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .row { display: flex; border-bottom: 1px solid #000; width: 100%; flex-wrap: wrap; }
        .cell { border-right: 1px solid #000; padding: 12px; display: flex; flex-direction: column; flex: 1; min-width: 150px; }
        .cell:last-child { border-right: none; }
        
        label { font-size: 10px; font-weight: bold; margin-bottom: 6px; color: var(--blue); text-transform: uppercase; }
        input, textarea, select { border: none; outline: none; font-size: 14px; background: transparent; width: 100%; color: #000; }
        
        .area-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; width: 100%; padding: 5px 0; }
        .check-item { display: flex; align-items: center; font-size: 10px; font-weight: bold; }

        /* Estilos do Canvas de Desenho */
        #drawing-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; }
        #canvas-paint { background: white; touch-action: none; cursor: crosshair; flex-grow: 1; width: 100%; }
        .paint-controls { background: #333; padding: 15px; display: flex; justify-content: space-around; gap: 10px; }
        .paint-btn { padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        
        .photo-upload { padding: 20px; border: 2px dashed var(--gray); margin: 10px; text-align: center; cursor: pointer; }
        #preview { width: 100%; max-height: 300px; object-fit: contain; display: none; margin: 10px auto; border: 1px solid #000; }

        .btn-submit { background: var(--blue); color: white; border: none; padding: 20px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: auto; }
        #statusMsg { font-size: 12px; text-align: center; padding: 15px; display: none; font-weight: bold; }

        @media (max-width: 480px) { .cell { min-width: 100%; border-right: none; border-bottom: 1px solid #000; } }
    </style>
</head>
<body>

<div class="app-container">
    <form id="hSEForm">
        <table class="header-table">
            <tr>
                <td style="width: 20%;"><img id="logoImg" src="logo-elecnor.png" class="logo-img"></td>
                <td style="width: 50%;">FORMULARIO NEARMISS<br>PROYECTO COPIAPÓ SOLAR</td>
                <td style="width: 30%;" class="tech-info">
                    CÓDIGO: FT-PC-HSE-43<br> FECHA: 05/05/2026<br> PÁGINA: 1 DE 1 <br> REVISIÓN: 00 <br> CATEGORÍA: GENERAL <br> SECTOR: SEGURIDAD
                </td>
            </tr>
        </table>
        
        <div class="section-header">1. CONTEXTO</div>
        <div class="row">
            <div class="cell"><label>FECHA:</label><input type="date" id="fecha" required></div>
            <div class="cell"><label>HORA:</label><input type="time" id="hora" required></div>
        </div>
        <div class="row">
            <div class="cell"><label>DEPARTAMENTO:</label>
                <select id="depto" required>
                    <option value="">SELECCIONE...</option>
                    <option value="ADMINISTRATIVO">ADMINISTRATIVO</option>
                    <option value="CALIDAD">CALIDAD</option>
                    <option value="CIVIL">CIVIL</option>
                    <option value="CORPORATIVO">CORPORATIVO</option>
                    <option value="ELÉCTRICA">ELÉCTRICA</option>
                    <option value="FLOTAS">FLOTAS</option>
                    <option value="H&S">H&S</option>
                    <option value="INFRAESTRUCTURA">INFRAESTRUCTURA</option>
                    <option value="INGENIERÍA">INGENIERÍA</option>
                    <option value="LOGÍSTICA">LOGÍSTICA</option>
                    <option value="MECÁNICA">MECÁNICA</option>
                    <option value="MEDIO AMBIENTE">MEDIO AMBIENTE</option>
                    <option value="OTROS">OTROS</option>
                    <option value="PLANIFICACIÓN">PLANIFICACIÓN</option>
                    <option value="RR. HH.">RR. HH.</option>
                    <option value="SUBCONTRATADA">SUBCONTRATADA</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="cell"><label>ÁREA ESPECÍFICA:</label>
                <div class="area-grid">
                    <label class="check-item"><input type="checkbox" name="area" value="IIFF"> IIFF</label>
                    <label class="check-item"><input type="checkbox" name="area" value="PV"> PV</label>
                    <label class="check-item"><input type="checkbox" name="area" value="BESS"> BESS</label>
                    <label class="check-item"><input type="checkbox" name="area" value="LAT"> LAT</label>
                    <label class="check-item"><input type="checkbox" name="area" value="SE C.P"> SE C.P</label>
                    <label class="check-item"><input type="checkbox" name="area" value="SE ELE"> SE ELE</label>
                </div>
            </div>
        </div>

        <div class="section-header">2. DESCRIPCIÓN DEL EVENTO / HALLAZGO</div>
        <div class="row"><div class="cell"><textarea id="desc" rows="4" placeholder="DESCRIBA LO SUCEDIDO..." required></textarea></div></div>

        <div class="section-header">3. REGISTRO FOTOGRÁFICO / DIBUJO</div>
        <div class="photo-upload" id="upload-trigger">
            <label style="cursor:pointer">📸 TOQUE PARA CAPTURAR FOTO</label>
            <input type="file" id="foto" accept="image/*" style="display:none;">
        </div>
        <div style="text-align: center; padding: 10px;">
            <button type="button" class="paint-btn" style="background: var(--blue); color: white; width: 90%;" onclick="iniciarDesenhoBranco()">🎨 REALIZAR DIBUJO EN BLANCO</button>
        </div>
        <img id="preview">

        <div class="section-header">4. IDENTIFICACIÓN</div>
        <div class="row">
            <div class="cell"><label>NOMBRE Y APELLIDO:</label><input type="text" id="relator" placeholder="NOMBRE COMPLETO" required></div>
            <div class="cell"><label>EMPRESA:</label><input type="text" id="empresa" required placeholder="NOMBRE DE LA EMPRESA"></div>
        </div>

        <div id="statusMsg"></div>
        <button type="submit" id="submitBtn" class="btn-submit">ENVIAR Y GENERAR PDF</button>
    </form>
</div>

<div id="drawing-container">
    <canvas id="canvas-paint"></canvas>
    <div class="paint-controls">
        <button class="paint-btn" style="background:#ff4444; color:white" id="cancel-paint">CANCELAR</button>
        <button class="paint-btn" style="background:#44bb44; color:white" id="save-paint">GUARDAR DIBUJO</button>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwpvovV6jGu_7lazLY3HfvCaBxVPOUjtLKHNjmBuKEGyM5QIxrEIgeo9kq5DPZRyEePJg/exec';

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(e => console.log(e));
        });
    }

    const form = document.getElementById('hSEForm');
    const fotoInput = document.getElementById('foto');
    const preview = document.getElementById('preview');
    const drawingContainer = document.getElementById('drawing-container');
    const canvas = document.getElementById('canvas-paint');
    const ctx = canvas.getContext('2d');
    let painting = false;

    function saveToQueue(data) {
        let queue = JSON.parse(localStorage.getItem('hse_queue') || '[]');
        queue.push(data);
        localStorage.setItem('hse_queue', JSON.stringify(queue));
    }

    async function syncQueue() {
        if (!navigator.onLine) return;
        let queue = JSON.parse(localStorage.getItem('hse_queue') || '[]');
        if (queue.length === 0) return;
        for (let i = 0; i < queue.length; i++) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(queue[i]) });
                queue.splice(i, 1); i--;
            } catch (e) { break; }
        }
        localStorage.setItem('hse_queue', JSON.stringify(queue));
    }
    window.addEventListener('online', syncQueue);
    window.addEventListener('load', syncQueue);

    document.getElementById('upload-trigger').onclick = () => fotoInput.click();

    fotoInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            preview.src = event.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    });

    function iniciarDesenhoBranco() {
        drawingContainer.style.display = 'flex';
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.8;
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "red";
        ctx.lineWidth = 4;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
    }

    function startPosition(e) { painting = true; draw(e); }
    function finishedPosition() { painting = false; ctx.beginPath(); }
    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        ctx.lineTo(clientX - rect.left, clientY - rect.top);
        ctx.stroke(); ctx.beginPath(); ctx.moveTo(clientX - rect.left, clientY - rect.top);
    }
    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startPosition(e); }, {passive: false});
    window.addEventListener('mouseup', finishedPosition);
    window.addEventListener('touchend', finishedPosition);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, {passive: false});

    document.getElementById('cancel-paint').onclick = () => { drawingContainer.style.display = 'none'; };
    document.getElementById('save-paint').onclick = () => {
        preview.src = canvas.toDataURL('image/jpeg', 0.7);
        preview.style.display = 'block';
        drawingContainer.style.display = 'none';
        fotoInput.value = ""; 
    };

    async function getLogoBase64(url) {
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        } catch (e) { return null; }
    }

    // GERAÇÃO DE PDF ESTRUTURADA POR COORDENADAS FIXAS (MÉTRICA GLOBAL)
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusMsg');
        const relatorNome = document.getElementById('relator').value.toUpperCase();
        
        btn.disabled = true; status.style.display = "block"; status.style.color = "orange";
        status.innerText = "⏳ PROCESANDO REPORTE...";

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const corDeFundo = [203, 213, 224];
        const corDoRotulo = [0, 51, 102];

        // --- 1. CABECERA TÉCNICA RÍGIDA ---
        doc.setLineWidth(0.4);
        doc.rect(10, 10, 190, 25); 
        doc.line(50, 10, 50, 35); 
        doc.line(150, 10, 150, 35);
        
        const logoBase64 = await getLogoBase64('logo-elecnor.png');
        if (logoBase64) doc.addImage(logoBase64, 'PNG', 13, 14, 32, 16);
        
        doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(0);
        doc.text("FORMULARIO NEARMISS", 100, 20, { align: 'center' });
        doc.text("PROYECTO COPIAPÓ SOLAR", 100, 27, { align: 'center' });
        
        doc.setFontSize(7);
        doc.text("CÓDIGO: FT-PC-HSE-43", 152, 15);
        doc.text("FECHA: 05/05/2026", 152, 19);
        doc.text("PÁGINA: 1 DE 1", 152, 23);
        doc.text("REVISIÓN: 00", 152, 27);
        doc.text("CATEGORÍA: GENERAL", 152, 31);
        doc.text("SECTOR: SEGURIDAD", 152, 34);

        // --- 2. SECCIÓN 1: CONTEXTO ---
        let currentY = 35;
        doc.setFillColor(...corDeFundo); doc.rect(10, currentY, 190, 8, 'F'); doc.rect(10, currentY, 190, 8);
        doc.setFontSize(9); doc.setTextColor(0); doc.text("1. CONTEXTO", 12, currentY + 5.5);
        
        currentY += 8;
        doc.rect(10, currentY, 95, 14); doc.rect(105, currentY, 95, 14);
        doc.setFontSize(7); doc.setTextColor(...corDoRotulo);
        doc.text("FECHA:", 12, currentY + 4); doc.text("HORA:", 107, currentY + 4);
        doc.setFontSize(10); doc.setTextColor(0); doc.setFont("helvetica", "normal");
        doc.text(document.getElementById('fecha').value, 12, currentY + 10);
        doc.text(document.getElementById('hora').value, 107, currentY + 10);

        currentY += 14;
        doc.rect(10, currentY, 190, 14);
        doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(...corDoRotulo); 
        doc.text("DEPARTAMENTO:", 12, currentY + 4);
        doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(0); 
        doc.text(document.getElementById('depto').value, 12, currentY + 10);

        // Subseção Área Específica (Layout Rígido de Checkboxes)
        currentY += 14;
        doc.rect(10, currentY, 190, 14);
        doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(...corDoRotulo);
        doc.text("ÁREA ESPECÍFICA:", 12, currentY + 4);
        
        const possibleAreas = ["IIFF", "PV", "BESS", "LAT", "SE C.P", "SE ELE"];
        const checkedAreas = Array.from(document.querySelectorAll('input[name="area"]:checked')).map(cb => cb.value);
        doc.setFontSize(9); doc.setTextColor(0);
        
        possibleAreas.forEach((area, index) => {
            let startX = 12 + (index * 31);
            doc.rect(startX, currentY + 6.5, 3.5, 3.5); // Desenha a caixinha do checkbox
            if (checkedAreas.includes(area)) {
                doc.setFont("helvetica", "bold");
                doc.text("X", startX + 0.8, currentY + 9.3); // Marca com X se estiver checado
            }
            doc.setFont("helvetica", "normal");
            doc.text(area, startX + 5, currentY + 9.5);
        });

        // --- 3. SEÇÃO 2: DESCRIPCIÓN ---
        currentY += 14;
        doc.setFillColor(...corDeFundo); doc.rect(10, currentY, 190, 8, 'F'); doc.rect(10, currentY, 190, 8);
        doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.text("2. DESCRIPCIÓN DEL EVENTO / HALLAZGO", 12, currentY + 5.5);
        
        currentY += 8;
        doc.rect(10, currentY, 190, 36); doc.setFont("helvetica", "normal"); doc.setFontSize(10);
        const splitLines = doc.splitTextToSize(document.getElementById('desc').value.toUpperCase(), 182);
        doc.text(splitLines, 12, currentY + 6);

        // --- 4. SEÇÃO 3: REGISTRO FOTOGRÁFICO ---
        currentY += 36;
        doc.setFillColor(...corDeFundo); doc.rect(10, currentY, 190, 8, 'F'); doc.rect(10, currentY, 190, 8);
        doc.setFont("helvetica", "bold"); doc.text("3. REGISTRO FOTOGRÁFICO", 12, currentY + 5.5);
        
        currentY += 8;
        doc.rect(10, currentY, 190, 96);
        if (preview.src && preview.style.display !== 'none') {
            doc.addImage(preview.src, 'JPEG', 11, currentY + 1, 188, 94);
        }

        // --- 5. SEÇÃO 4: IDENTIFICACIÓN ---
        currentY += 96;
        doc.setFillColor(...corDeFundo); doc.rect(10, currentY, 190, 8, 'F'); doc.rect(10, currentY, 190, 8);
        doc.setFont("helvetica", "bold"); doc.text("4. IDENTIFICACIÓN", 12, currentY + 5.5);
        
        currentY += 8;
        doc.rect(10, currentY, 95, 16); doc.rect(105, currentY, 95, 16);
        doc.setFontSize(7); doc.setTextColor(...corDoRotulo);
        doc.text("NOMBRE Y APELLIDO:", 12, currentY + 4); doc.text("EMPRESA:", 107, currentY + 4);
        doc.setFontSize(10); doc.setTextColor(0); doc.setFont("helvetica", "normal");
        doc.text(relatorNome, 12, currentY + 11);
        doc.text(document.getElementById('empresa').value.toUpperCase(), 107, currentY + 11);

        // --- PROCESSO DE ENVIO ---
        const pdfBase64 = doc.output('datauristring').split(',')[1];
        const fileName = `${relatorNome}_${document.getElementById('fecha').value}.pdf`;
        const payload = { name: fileName, bytes: pdfBase64 };

        if (navigator.onLine) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                status.innerText = "✅ ¡ENVIADO EXITOSAMENTE AO DRIVE!";
                status.style.color = "green";
            } catch (err) {
                saveToQueue(payload);
                status.innerText = "⚠️ ERROR DE RED. GUARDADO PARA SYNC AUTOMÁTICO.";
                status.style.color = "orange";
            }
        } else {
            saveToQueue(payload);
            status.innerText = "☁️ MODO OFFLINE: GUARDADO PARA SINCRONIZAR LUEGO.";
            status.style.color = "blue";
        }

        doc.save(fileName);
        form.reset();
        preview.style.display = 'none';
        btn.disabled = false;
        setTimeout(() => { status.style.display = 'none'; }, 6000);
    });
</script>
</body>
</html>
