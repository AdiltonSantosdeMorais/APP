<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HSE ELECNOR</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --blue: #003366; --gray: #cbd5e0; --light-gray: #f0f2f5; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--light-gray); margin: 0; padding: 0; width: 100%; 
        }

        /* Correção de Responsividade iOS */
        .app-container { 
            background: white; width: 100%; max-width: 800px; margin: 0 auto; 
            min-height: 100vh; border: 1px solid #000; display: flex; flex-direction: column; 
            padding-bottom: env(safe-area-inset-bottom);
        }

        input[type="time"], input[type="date"], select, input[type="text"], textarea {
            font-size: 16px !important; /* Evita zoom automático no iOS */
            padding: 10px; border-radius: 4px; border: 1px solid #ddd;
            width: 100%; background: #fff; appearance: none; -webkit-appearance: none;
        }

        .header-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .header-table td { border: 1px solid #000; text-align: center; padding: 5px; font-weight: bold; font-size: 10px; }
        .logo-img { width: 60px; height: auto; }
        .tech-info { text-align: left !important; font-size: 7px !important; line-height: 1.2; }

        .section-header { background: var(--gray); border: 1px solid #000; padding: 10px; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .row { display: flex; border-bottom: 1px solid #000; width: 100%; flex-wrap: wrap; }
        .cell { border-right: 1px solid #000; padding: 10px; display: flex; flex-direction: column; flex: 1; min-width: 50%; }
        
        label { font-size: 9px; font-weight: bold; margin-bottom: 4px; color: var(--blue); }

        /* Estilos de Desenho/Foto */
        .media-actions { display: flex; gap: 10px; padding: 10px; background: #fff; }
        .btn-media { flex: 1; padding: 12px; border: 1px solid var(--blue); background: #f8f9fa; border-radius: 5px; font-weight: bold; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        
        #drawing-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 10000; flex-direction: column; }
        #canvas-paint { background: #fff; touch-action: none; flex-grow: 1; width: 100%; }
        .paint-controls { background: var(--blue); padding: 15px; display: flex; justify-content: space-around; }

        #preview { width: 100%; max-height: 350px; object-fit: contain; display: none; margin: 10px 0; border: 1px solid #000; background: #eee; }

        .btn-submit { background: var(--blue); color: white; border: none; padding: 20px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; }
        #statusMsg { font-size: 12px; text-align: center; padding: 15px; font-weight: bold; }

        @media (max-width: 480px) { .cell { min-width: 100%; border-right: none; } }
    </style>
</head>
<body>

<div class="app-container">
    <form id="hSEForm">
        <table class="header-table">
            <tr>
                <td style="width: 20%;"><img id="logoImg" src="logo-elecnor.png" class="logo-img"></td>
                <td style="width: 50%;">FORMULARIO NEARMISS<br>PROYECTO COPIAPÓ SOLAR</td>
                <td style="width: 30%;" class="tech-info">CÓDIGO: <br> FECHA: <br> PÁGINA: 1 DE 1 <br> REVISIÓN: 00</td>
            </tr>
        </table>
        
        <div class="section-header">1. CONTEXTO</div>
        <div class="row">
            <div class="cell"><label>FECHA:</label><input type="date" id="fecha" required></div>
            <div class="cell"><label>HORA:</label><input type="time" id="hora" required></div>
        </div>
        <div class="row">
            <div class="cell">
                <label>DEPARTAMENTO:</label>
                <select id="depto" required>
                    <option value="">SELECCIONE...</option>
                    <option value="ADMINISTRATIVO">ADMINISTRATIVO</option>
                    <option value="CALIDAD">CALIDAD</option>
                    <option value="CIVIL">CIVIL</option>
                    <option value="CORPORATIVO">CORPORATIVO</option>
                    <option value="ELÉCTRICA">ELÉCTRICA</option>
                    <option value="FLOTAS">FLOTAS</option>
                    <option value="H&S">H&S</option>
                    <option value="INFRAESTRUCTURA">INFRAESTRUCTURA</option>
                    <option value="INGENIERÍA">INGENIERÍA</option>
                    <option value="LOGÍSTICA">LOGÍSTICA</option>
                    <option value="MECÁNICA">MECÁNICA</option>
                    <option value="MEDIO AMBIENTE">MEDIO AMBIENTE</option>
                    <option value="OTROS">OTROS</option>
                    <option value="PLANIFICACIÓN">PLANIFICACIÓN</option>
                    <option value="RR. HH.">RR. HH.</option>
                    <option value="SUBCONTRATADA">SUBCONTRATADA</option>
                </select>
            </div>
        </div>

        <div class="section-header">2. DESCRIPCIÓN DO EVENTO</div>
        <div class="row"><div class="cell"><textarea id="desc" rows="4" placeholder="DESCRIBA LO SUCEDIDO..." required></textarea></div></div>

        <div class="section-header">3. REGISTRO FOTOGRÁFICO / DIBUJO</div>
        <div class="media-actions">
            <div class="btn-media" onclick="document.getElementById('foto').click()">📸 ADJUNTAR FOTO</div>
            <div class="btn-media" onclick="abrirDibujoBlanco()">🎨 DIBUJAR</div>
        </div>
        <input type="file" id="foto" accept="image/*" style="display:none;">
        <img id="preview">

        <div class="section-header">4. IDENTIFICACIÓN</div>
        <div class="row">
            <div class="cell"><label>NOMBRE Y APELLIDO:</label><input type="text" id="relator" required></div>
            <div class="cell"><label>EMPRESA:</label><input type="text" id="empresa" required></div>
        </div>

        <div id="statusMsg"></div>
        <button type="submit" id="submitBtn" class="btn-submit">ENVIAR REPORTE</button>
    </form>
</div>

<div id="drawing-container">
    <div class="paint-controls">
        <button onclick="cerrarDibujo()" style="background:red; color:#fff; border:none; padding:10px; border-radius:5px;">CANCELAR</button>
        <button onclick="guardarDibujo()" style="background:green; color:#fff; border:none; padding:10px; border-radius:5px;">ACEPTAR</button>
    </div>
    <canvas id="canvas-paint"></canvas>
</div>

<script>
    const GOOGLE_SCRIPT_URL = 'SUA_URL_AQUI';

    // 1. SINCRONIZAÇÃO RÁPIDA (SERVICE WORKER ATUALIZADO)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(reg => {
            reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        window.location.reload(); // Atualiza o app imediatamente se houver mudança
                    }
                };
            };
        });
    }

    const fotoInput = document.getElementById('foto');
    const preview = document.getElementById('preview');
    const canvas = document.getElementById('canvas-paint');
    const ctx = canvas.getContext('2d');
    let painting = false;

    // --- ANEXO IMEDIATO DA FOTO ---
    fotoInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                preview.src = event.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    // --- LÓGICA DE DESENHO EM BRANCO ---
    function abrirDibujoBlanco() {
        document.getElementById('drawing-container').style.display = 'flex';
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 60;
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "red";
        ctx.lineWidth = 3;
    }

    function cerrarDibujo() { document.getElementById('drawing-container').style.display = 'none'; }

    function guardarDibujo() {
        preview.src = canvas.toDataURL('image/jpeg', 0.8);
        preview.style.display = 'block';
        cerrarDibujo();
    }

    // Eventos de Desenho (iOS/Android)
    function startDraw(e) { painting = true; draw(e); }
    function endDraw() { painting = false; ctx.beginPath(); }
    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, {passive: false});
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, {passive: false});
    window.addEventListener('mouseup', endDraw);
    window.addEventListener('touchend', endDraw);

    // --- ENVIO E FILA ---
    document.getElementById('hSEForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusMsg');
        const relatorNome = document.getElementById('relator').value.toUpperCase();
        
        btn.disabled = true;
        status.style.display = "block";
        status.innerText = "⏳ PROCESANDO...";

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        
        // (Aqui entra o seu código de desenho do PDF que já funciona perfeitamente)
        // ... doc.rect, doc.text, etc ...
        if(preview.src) doc.addImage(preview.src, 'JPEG', 15, 120, 180, 95);

        const pdfBase64 = doc.output('datauristring').split(',')[1];
        const fileName = `${relatorNome}_${Date.now()}.pdf`;
        const payload = { name: fileName, bytes: pdfBase64 };

        if (navigator.onLine) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                status.innerText = "✅ ENVIADO!";
                status.style.color = "green";
            } catch (err) {
                saveToQueue(payload);
                status.innerText = "⚠️ GUARDADO (SIN RED)";
            }
        } else {
            saveToQueue(payload);
            status.innerText = "☁️ OFFLINE: GUARDADO";
        }

        doc.save(fileName);
        this.reset();
        preview.style.display = 'none';
        btn.disabled = false;
    });

    function saveToQueue(data) {
        let queue = JSON.parse(localStorage.getItem('hse_queue') || '[]');
        queue.push(data);
        localStorage.setItem('hse_queue', JSON.stringify(queue));
    }
</script>
</body>
</html>
