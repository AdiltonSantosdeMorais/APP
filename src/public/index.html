<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSE</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --blue: #003366; --gray: #cbd5e0; --light-gray: #f0f2f5; }
        body { font-family: Arial, sans-serif; background: var(--light-gray); margin: 0; padding: 0; width: 100%; }
        .app-container { background: white; width: 100%; max-width: 800px; margin: 0 auto; min-height: 100vh; border: 1px solid #000; box-sizing: border-box; display: flex; flex-direction: column; }
        .header-table { width: 100%; border-collapse: collapse; }
        .header-table td { border: 1px solid #000; text-align: center; padding: 5px; font-weight: bold; font-size: 10px; }
        .logo-img { width: 70px; height: auto; }
        .tech-info { text-align: left !important; font-size: 8px !important; line-height: 1.3; padding-left: 8px !important; }
        .section-header { background: var(--gray); border: 1px solid #000; padding: 8px 10px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .row { display: flex; border-bottom: 1px solid #000; width: 100%; flex-wrap: wrap; }
        .cell { border-right: 1px solid #000; padding: 10px; display: flex; flex-direction: column; flex: 1; min-width: 140px; box-sizing: border-box; }
        .cell:last-child { border-right: none; }
        label { font-size: 10px; font-weight: bold; margin-bottom: 4px; color: var(--blue); text-transform: uppercase; }
        input, textarea, select { border: none; outline: none; font-size: 14px; background: transparent; width: 100%; font-family: inherit; text-transform: uppercase; color: #000; }
        .area-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 5px; width: 100%; padding: 5px 0; }
        .check-item { display: flex; align-items: center; font-size: 10px; font-weight: bold; }
        .check-item input { width: auto; margin-right: 5px; }
        .photo-upload { padding: 15px; border: 2px dashed var(--gray); margin: 10px; text-align: center; cursor: pointer; border-radius: 4px; }
        #preview { width: 100%; max-height: 250px; object-fit: contain; display: none; margin: 10px auto; border: 1px solid #000; }
        .btn-submit { background: var(--blue); color: white; border: none; padding: 20px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; margin-top: auto; }
        #statusMsg { font-size: 12px; text-align: center; padding: 10px; display: none; font-weight: bold; }
        @media (max-width: 480px) { .cell { min-width: 100%; border-right: none; border-bottom: 1px solid #000; } }
    </style>
</head>
<body>
<div class="app-container">
    <form id="hSEForm">
        <table class="header-table">
            <tr>
                <td style="width: 20%;"><img id="logoImg" src="logo-elecnor.png" class="logo-img"></td>
                <td style="width: 50%; font-size: 12px;">FORMULARIO NEARMISS<br>PROYECTO COPIAPÓ SOLAR</td>
                <td style="width: 30%;" class="tech-info">CÓDIGO: <br>FECHA: <br>PÁGINA: 1 DE 1 <br>REVISIÓN: 00 <br>CATEGORÍA: GENERAL <br>SECTOR: SEGURIDAD</td>
            </tr>
        </table>
        
        <div class="section-header">1. CONTEXTO</div>
        <div class="row">
            <div class="cell"><label>FECHA:</label><input type="date" id="fecha" required></div>
            <div class="cell"><label>HORA:</label><input type="time" id="hora" required></div>
        </div>
        <div class="row">
            <div class="cell"><label>DEPARTAMENTO:</label>
                <select id="depto" required>
                    <option value="">SELECCIONE...</option>
                    <option value="ADMINISTRATIVO">ADMINISTRATIVO</option>
                    <option value="CALIDAD">CALIDAD</option>
                    <option value="CIVIL">CIVIL</option>
                    <option value="CORPORATIVO">CORPORATIVO</option>
                    <option value="ELÉCTRICA">ELÉCTRICA</option>
                    <option value="FLOTAS">FLOTAS</option>
                    <option value="H&S">H&S</option>
                    <option value="INFRAESTRUCTURA">INFRAESTRUCTURA</option>
                    <option value="INGENIERÍA">INGENIERÍA</option>
                    <option value="LOGÍSTICA">LOGÍSTICA</option>
                    <option value="MECÁNICA">MECÁNICA</option>
                    <option value="MEDIO AMBIENTE">MEDIO AMBIENTE</option>
                    <option value="OTROS">OTROS</option>
                    <option value="PLANIFICACIÓN">PLANIFICACIÓN</option>
                    <option value="RR. HH.">RR. HH.</option>
                    <option value="SUBCONTRATADA">SUBCONTRATADA</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="cell"><label>ÁREA ESPECÍFICA:</label>
                <div class="area-grid">
                    <label class="check-item"><input type="checkbox" name="area" value="IIFF"> IIFF</label>
                    <label class="check-item"><input type="checkbox" name="area" value="PV"> PV</label>
                    <label class="check-item"><input type="checkbox" name="area" value="BESS"> BESS</label>
                    <label class="check-item"><input type="checkbox" name="area" value="LAT"> LAT</label>
                    <label class="check-item"><input type="checkbox" name="area" value="SE C.P"> SE C.P</label>
                    <label class="check-item"><input type="checkbox" name="area" value="SE ELE"> SE ELE</label>
                </div>
            </div>
        </div>
        <div class="section-header">2. DESCRIPCIÓN DEL EVENTO / HALLAZGO</div>
        <div class="row"><div class="cell"><textarea id="desc" rows="4" placeholder="DESCRIBA LO SUCEDIDO..." required></textarea></div></div>
        <div class="section-header">3. REGISTRO FOTOGRÁFICO</div>
        <div class="photo-upload" onclick="document.getElementById('foto').click()">
            <label style="cursor:pointer">📸 TOQUE PARA CAPTURAR FOTO</label>
            <input type="file" id="foto" accept="image/*" style="display:none;">
            <img id="preview">
        </div>
        <div class="section-header">4. IDENTIFICACIÓN</div>
        <div class="row">
            <div class="cell"><label>NOMBRE Y APELLIDO:</label><input type="text" id="relator" placeholder="NOMBRE COMPLETO" required></div>
            <div class="cell"><label>EMPRESA:</label><input type="text" id="empresa" required placeholder="NOMBRE DE LA EMPRESA"></div>
        </div>
        <div id="statusMsg"></div>
        <button type="submit" id="submitBtn" class="btn-submit">ENVIAR Y GENERAR PDF</button>
    </form>
</div>

<script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwpvovV6jGu_7lazLY3HfvCaBxVPOUjtLKHNjmBuKEGyM5QIxrEIgeo9kq5DPZRyEePJg/exec';

    // Registro do Service Worker (Essencial para Offline)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
    }

    const form = document.getElementById('hSEForm');
    const fotoInput = document.getElementById('foto');
    const preview = document.getElementById('preview');

    fotoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
            reader.readAsDataURL(file);
        }
    });

    async function getLogoBase64(url) {
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        } catch (e) { return null; }
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusMsg');
        const relatorNome = document.getElementById('relator').value.toUpperCase();
        
        btn.disabled = true;
        status.style.display = "block";
        status.innerText = "⏳ PROCESANDO...";

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const corDeFundo = [203, 213, 224];
        const corDoRotulo = [0, 51, 102];

        // --- PDF LAYOUT ---
        doc.setLineWidth(0.5);
        doc.rect(10, 10, 190, 25); 
        doc.line(50, 10, 50, 35); doc.line(150, 10, 150, 35);
        const logoBase64 = await getLogoBase64('logo-elecnor.png');
        if (logoBase64) doc.addImage(logoBase64, 'PNG', 12, 12, 35, 15);
        doc.setFontSize(11); doc.setFont("helvetica", "bold");
        doc.text("FORMULARIO NEARMISS", 100, 20, { align: 'center' });
        doc.text("PROYECTO COPIAPÓ SOLAR", 100, 27, { align: 'center' });

        // Seção 1
        doc.setFillColor(...corDeFundo); doc.rect(10, 35, 190, 8, 'F'); doc.rect(10, 35, 190, 8);
        doc.setFontSize(10); doc.setTextColor(0); doc.text("1. CONTEXTO", 12, 41);
        doc.rect(10, 43, 190, 12); doc.line(105, 43, 105, 55);
        doc.setFontSize(7); doc.setTextColor(...corDoRotulo); doc.text("FECHA:", 12, 46); doc.text("HORA:", 107, 46);
        doc.setFontSize(10); doc.setTextColor(0); doc.text(document.getElementById('fecha').value, 12, 52); doc.text(document.getElementById('hora').value, 107, 52);
        
        doc.rect(10, 55, 190, 12); doc.line(80, 55, 80, 67);
        doc.setFontSize(7); doc.setTextColor(...corDoRotulo); doc.text("DEPARTAMENTO:", 12, 59); doc.text("ÁREA ESPECÍFICA:", 82, 59);
        doc.setFontSize(9); doc.setTextColor(0); doc.text(document.getElementById('depto').value, 12, 64);
        const areas = Array.from(document.querySelectorAll('input[name="area"]:checked')).map(cb => cb.value).join(', ');
        doc.text(areas, 82, 64);

        // Seção 2
        doc.setFillColor(...corDeFundo); doc.rect(10, 67, 190, 8, 'F'); doc.rect(10, 67, 190, 8);
        doc.setFontSize(10); doc.setFont("helvetica", "bold"); doc.text("2. DESCRIPCIÓN DEL EVENTO", 12, 73);
        doc.rect(10, 75, 190, 35); doc.setFontSize(10); doc.setFont("helvetica", "normal");
        const lines = doc.splitTextToSize(document.getElementById('desc').value.toUpperCase(), 180);
        doc.text(lines, 12, 82);

        // Seção 3
        doc.setFillColor(...corDeFundo); doc.rect(10, 110, 190, 8, 'F'); doc.rect(10, 110, 190, 8);
        doc.text("3. REGISTRO FOTOGRÁFICO", 12, 116);
        doc.rect(10, 118, 190, 105);
        if (preview.style.display === 'block') {
            const canvas = document.createElement('canvas');
            const img = new Image();
            img.src = preview.src;
            await new Promise(r => img.onload = r);
            const scale = 800 / img.width;
            canvas.width = 800; canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            doc.addImage(canvas.toDataURL('image/jpeg', 0.7), 'JPEG', 15, 122, 180, 95);
        }

        // Seção 4
        doc.setFillColor(...corDeFundo); doc.rect(10, 223, 190, 8, 'F'); doc.rect(10, 223, 190, 8);
        doc.text("4. IDENTIFICACIÓN", 12, 229);
        doc.rect(10, 231, 190, 15); doc.line(105, 231, 105, 246);
        doc.setFontSize(8); doc.setTextColor(...blueLabel); doc.text("NOMBRE Y APELLIDO:", 12, 235); doc.text("EMPRESA:", 107, 235);
        doc.setFontSize(10); doc.setTextColor(0); doc.text(relatorNome, 12, 242);
        doc.text(document.getElementById('empresa').value.toUpperCase(), 107, 242);

        const pdfBase64 = doc.output('datauristring').split(',')[1];
        const fileName = `${relatorNome}_${document.getElementById('fecha').value}.pdf`;
        
        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ name: fileName, bytes: pdfBase64 }) });
            status.innerText = "✅ ENVIADO!";
        } catch (err) {
            status.innerText = "⚠️ GUARDADO LOCALMENTE.";
        }

        doc.save(fileName);
        form.reset();
        preview.style.display = 'none';
        btn.disabled = false;
        setTimeout(() => { status.style.display = 'none'; }, 5000);
    });
</script>
</body>
</html>
