<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPORTE CASI ACCIDENTE / CONDICIÓN INSEGURA</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f9; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; border-top: 4px solid #003366; }
        .header { text-align: center; margin-bottom: 25px; }
        .logo { width: 180px; margin-bottom: 15px; }
        h2 { color: #003366; font-size: 18px; text-transform: uppercase; border-bottom: 1px solid #eee; padding-bottom: 15px; margin: 0; }
        .row { display: flex; gap: 15px; margin-top: 15px; }
        .form-group { flex: 1; display: flex; flex-direction: column; margin-bottom: 15px; }
        label { font-size: 13px; font-weight: bold; color: #444; margin-bottom: 5px; }
        input, textarea, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background-color: #fafafa; }
        input[type="file"] { background: none; border: none; padding: 5px 0; }
        input:focus, textarea:focus { border-color: #003366; outline: none; background-color: #fff; }
        button { background-color: #003366; color: white; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; text-transform: uppercase; margin-top: 10px; width: 100%; }
        button:hover { background-color: #002244; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="logo-elecnor.png" alt="Elecnor" class="logo">
            <h2>REPORTE CASI ACCIDENTE / CONDICIÓN INSEGURA</h2>
        </div>
        
        <form id="relatoForm">
            <div class="row">
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
                <div class="form-group">
                    <label for="hora">Hora</label>
                    <input type="time" id="hora" name="hora" required>
                </div>
            </div>

            <div class="form-group">
                <label for="unidad">Unidad / Localización</label>
                <input type="text" id="unidad" name="unidad" placeholder="Ej: SE Copiapó / L230kV" required>
            </div>

            <div class="form-group">
                <label for="empresa">Empresa</label>
                <input type="text" id="empresa" name="empresa" placeholder="Elecnor o Contratista" required>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción del Riesgo</label>
                <textarea id="descripcion" name="descripcion" rows="4" placeholder="Describa la condición o cuasi accidente" required></textarea>
            </div>

            <div class="form-group">
                <label for="foto">Evidencia Fotográfica (Opcional)</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <div class="form-group">
                <label for="accion">Acción Inmediata</label>
                <input type="text" id="accion" name="accion" placeholder="¿Qué se hizo al momento?" required>
            </div>

            <div class="form-group">
                <label for="supervisor">Supervisor Responsable</label>
                <input type="text" id="supervisor" name="supervisor" placeholder="Nombre del supervisor" required>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre del Relator</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre completo" required>
            </div>

            <button type="submit">ENVIAR REPORTE</button>
        </form>
    </div>

    <script>
        document.getElementById('relatoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Usamos FormData para suportar o envio de arquivos
            const formData = new FormData(e.target);

            try {
                const response = await fetch('/enviar-relato', {
                    method: 'POST',
                    body: formData // Enviado como multipart/form-data
                });

                const result = await response.json();
                alert(result.mensagem);
                if(response.ok) e.target.reset();
            } catch (error) {
                alert("Error al enviar el reporte.");
            }
        });
    </script>
</body>
</html>
