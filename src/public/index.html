<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSE ELECNOR - PROYECTO COPIAPÓ SOLAR</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --blue: #003366; --gray: #cbd5e0; --light-gray: #f0f2f5; }
        body { font-family: Arial, sans-serif; background: var(--light-gray); margin: 0; padding: 0; width: 100%; }
        .app-container { background: white; width: 100%; max-width: 800px; margin: 0 auto; min-height: 100vh; border: 1px solid #000; box-sizing: border-box; display: flex; flex-direction: column; }
        
        /* CABEÇALHO */
        .header-table { width: 100%; border-collapse: collapse; }
        .header-table td { border: 1px solid #000; text-align: center; padding: 5px; font-weight: bold; font-size: 10px; }
        .logo-img { width: 70px; height: auto; }
        .tech-info { text-align: left !important; font-size: 8px !important; line-height: 1.2; }
        
        /* SEÇÕES */
        .section-header { background: var(--gray); border: 1px solid #000; padding: 8px 10px; font-weight: bold; font-size: 12px; }
        .row { display: flex; border-bottom: 1px solid #000; width: 100%; flex-wrap: wrap; }
        .cell { border-right: 1px solid #000; padding: 10px; display: flex; flex-direction: column; flex: 1; min-width: 140px; box-sizing: border-box; }
        .cell:last-child { border-right: none; }
        
        label { font-size: 10px; font-weight: bold; margin-bottom: 4px; color: var(--blue); }
        input, textarea, select { border: none; outline: none; font-size: 14px; background: transparent; width: 100%; font-family: inherit; text-transform: uppercase; }
        
        /* REGISTRO FOTOGRÁFICO */
        .photo-upload { padding: 15px; border: 2px dashed var(--gray); margin: 10px; text-align: center; cursor: pointer; border-radius: 4px; }
        #preview { width: 100%; max-height: 200px; object-fit: contain; display: none; margin-top: 10px; }
        
        .btn-submit { background: var(--blue); color: white; border: none; padding: 20px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: auto; }
        #statusMsg { font-size: 12px; text-align: center; padding: 10px; display: none; font-weight: bold; }
        
        @media (max-width: 480px) { .cell { min-width: 100%; border-right: none; border-bottom: 1px solid #000; } }
    </style>
</head>
<body>
<div class="app-container">
    <form id="hSEForm">
        <table class="header-table">
            <tr>
                <td style="width: 20%;"><img id="logoImg" src="logo-elecnor.png" class="logo-img"></td>
                <td style="width: 50%; font-size: 12px;">FORMULARIO NEARMISS<br>PROYECTO COPIAPÓ SOLAR</td>
                <td style="width: 30%;" class="tech-info">
                    CODIGO: <br>
                    FECHA: <br>
                    PÁGINA: 1 DE 1 <br>
                    REVISIÓN: 00 <br>
                    CATEGORIA: GENERAL <br>
                    SECTOR: SEGURIDAD
                </td>
            </tr>
        </table>
        
        <div class="section-header">1. CONTEXTO</div>
        <div class="row">
            <div class="cell"><label>FECHA:</label><input type="date" id="fecha" required></div>
            <div class="cell"><label>HORA:</label><input type="time" id="hora" required></div>
        </div>
        <div class="row">
            <div class="cell"><label>DEPARTAMENTO:</label>
                <select id="depto" required>
                    <option value="">SELECCIONE...</option>
                    <option value="ADM/RRHH">ADM/RRHH</option>
                    <option value="CALIDAD">CALIDAD</option>
                    <option value="CIVIL">CIVIL</option>
                    <option value="ELECTRICA">ELECTRICA</option>
                    <option value="H&S">H&S</option>
                    <option value="LOGISTICA">LOGISTICA</option>
                </select>
            </div>
        </div>

        <div class="section-header">2. DESCRIPCIÓN DO EVENTO</div>
        <div class="row"><div class="cell"><textarea id="desc" rows="4" placeholder="DESCREVA O QUE ACONTECEU..." required></textarea></div></div>

        <div class="section-header">3. REGISTRO FOTOGRÁFICO</div>
        <div class="photo-upload" onclick="document.getElementById('foto').click()">
            <label style="cursor:pointer">📸 TOQUE PARA CAPTURAR FOTO</label>
            <input type="file" id="foto" accept="image/*" style="display:none;">
            <img id="preview">
        </div>

        <div class="section-header">4. IDENTIFICACIÓN</div>
        <div class="row">
            <div class="cell"><label>NOME E APELIDO:</label><input type="text" id="relator" placeholder="NOME COMPLETO" required></div>
            <div class="cell"><label>SUPERVISOR:</label><input type="text" id="supervisor" required placeholder="NOME DO SUPERVISOR"></div>
        </div>

        <div id="statusMsg"></div>
        <button type="submit" id="submitBtn" class="btn-submit">ENVIAR E GERAR PDF</button>
    </form>
</div>

<script>
    const GOOGLE_SCRIPT_URL = 'SUA_URL_AQUI'; // Substitua pela sua URL do Google Apps Script

    const fotoInput = document.getElementById('foto');
    const preview = document.getElementById('preview');

    fotoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
            reader.readAsDataURL(file);
        }
    });

    async function getLogoBase64(url) {
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        } catch (e) { return null; }
    }

    document.getElementById('hSEForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusMsg');
        const nomeRelator = document.getElementById('relator').value.toUpperCase();
        
        btn.disabled = true;
        btn.innerText = "ENVIANDO...";
        status.style.display = "block";
        status.innerText = "⏳ GERANDO PDF E SINCRONIZANDO...";

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const grayColor = [203, 213, 224];
        const blueLabel = [0, 51, 102];

        // --- CABEÇALHO ---
        doc.setLineWidth(0.5);
        doc.rect(10, 10, 190, 25); 
        doc.line(50, 10, 50, 35); doc.line(150, 10, 150, 35);
        
        const logoBase64 = await getLogoBase64('logo-elecnor.png');
        if (logoBase64) doc.addImage(logoBase64, 'PNG', 12, 12, 35, 15);

        doc.setFontSize(11); doc.setFont("helvetica", "bold");
        doc.text("FORMULARIO NEARMISS", 100, 20, { align: 'center' });
        doc.text("PROYECTO COPIAPÓ SOLAR", 100, 27, { align: 'center' });
        
        doc.setFontSize(7);
        doc.text("CODIGO:", 152, 15);
        doc.text("FECHA:", 152, 19);
        doc.text("PÁGINA: 1 DE 1", 152, 23);
        doc.text("REVISIÓN: 00", 152, 27);
        doc.text("CATEGORIA: GENERAL", 152, 31);
        doc.text("SECTOR: SEGURIDAD", 152, 34);

        // --- SEÇÕES (CONTEXTO, DESCRIÇÃO, FOTO, ID) ---
        // Seção 1
        doc.setFillColor(...grayColor); doc.rect(10, 35, 190, 8, 'F'); doc.rect(10, 35, 190, 8);
        doc.setFontSize(10); doc.setTextColor(0); doc.text("1. CONTEXTO", 12, 41);
        doc.rect(10, 43, 190, 12); doc.line(105, 43, 105, 55);
        doc.setFontSize(7); doc.setTextColor(...blueLabel);
        doc.text("FECHA:", 12, 47); doc.text("HORA:", 107, 47);
        doc.setFontSize(10); doc.setTextColor(0);
        doc.text(document.getElementById('fecha').value, 12, 52);
        doc.text(document.getElementById('hora').value, 107, 52);

        // Seção 2: Descrição
        doc.setFillColor(...grayColor); doc.rect(10, 67, 190, 8, 'F'); doc.rect(10, 67, 190, 8);
        doc.text("2. DESCRIPCIÓN DO EVENTO", 12, 73);
        doc.rect(10, 75, 190, 35);
        const descLines = doc.splitTextToSize(document.getElementById('desc').value.toUpperCase(), 180);
        doc.text(descLines, 12, 82);

        // Seção 3: Foto
        doc.setFillColor(...grayColor); doc.rect(10, 110, 190, 8, 'F'); doc.rect(10, 110, 190, 8);
        doc.text("3. REGISTRO FOTOGRÁFICO", 12, 116);
        doc.rect(10, 118, 190, 105);
        if (preview.style.display === 'block') {
            doc.addImage(preview.src, 'JPEG', 15, 122, 180, 95);
        }

        // Seção 4: Identificação
        doc.setFillColor(...grayColor); doc.rect(10, 223, 190, 8, 'F'); doc.rect(10, 223, 190, 8);
        doc.text("4. IDENTIFICACIÓN", 12, 229);
        doc.rect(10, 231, 190, 15); doc.line(105, 231, 105, 246);
        doc.setFontSize(8); doc.setTextColor(...blueLabel);
        doc.text("NOME E APELIDO:", 12, 235); doc.text("SUPERVISOR:", 107, 235);
        doc.setFontSize(10); doc.setTextColor(0);
        doc.text(nomeRelator, 12, 242);
        doc.text(document.getElementById('supervisor').value.toUpperCase(), 107, 242);

        // --- ENVIO COM NOME DO RELATOR ---
        const pdfBase64 = doc.output('datauristring').split(',')[1];
        const payload = JSON.stringify({
            name: `${nomeRelator}_${document.getElementById('fecha').value}.pdf`,
            bytes: pdfBase64
        });

        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: payload });
            status.innerText = "✅ ENVIADO COM SUCESSO!";
            doc.save(`${nomeRelator}_${document.getElementById('fecha').value}.pdf`);
        } catch (err) {
            status.innerText = "❌ ERRO AO SINCRONIZAR.";
        }

        btn.disabled = false;
        btn.innerText = "ENVIAR E GERAR PDF";
    });
</script>
</body>
</html>
