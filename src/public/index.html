<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSE Elecnor - Copiapó Solar</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --blue: #003366; --gray: #cbd5e0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
        .app-container { background: white; width: 100%; max-width: 800px; margin: 0 auto; min-height: 100vh; border: 1px solid #000; box-sizing: border-box; display: flex; flex-direction: column; }
        .header-table { width: 100%; border-collapse: collapse; }
        .header-table td { border: 1px solid #000; text-align: center; padding: 5px; font-weight: bold; font-size: 11px; }
        .logo-img { width: 80px; height: auto; }
        .section-header { background: var(--gray); border: 1px solid #000; padding: 8px 10px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .row { display: flex; border-bottom: 1px solid #000; width: 100%; flex-wrap: wrap; }
        .cell { border-right: 1px solid #000; padding: 10px; display: flex; flex-direction: column; flex: 1; min-width: 140px; box-sizing: border-box; }
        .cell:last-child { border-right: none; }
        label { font-size: 10px; font-weight: bold; margin-bottom: 4px; color: var(--blue); }
        input, textarea, select { border: none; outline: none; font-size: 14px; background: transparent; width: 100%; font-family: inherit; }
        .area-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 5px; width: 100%; padding: 5px 0; }
        .check-item { display: flex; align-items: center; font-size: 10px; font-weight: bold; }
        .check-item input { width: auto; margin-right: 5px; }
        .photo-upload { padding: 15px; border: 2px dashed var(--gray); margin: 10px; text-align: center; cursor: pointer; border-radius: 4px; }
        #preview { width: 100%; max-height: 150px; object-fit: contain; display: none; margin-top: 10px; }
        .btn-submit { background: var(--blue); color: white; border: none; padding: 20px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; margin-top: auto; }
        @media (max-width: 480px) { .cell { min-width: 100%; border-right: none; border-bottom: 1px solid #000; } }
    </style>
</head>
<body>
<div class="app-container">
    <form id="hSEForm">
        <table class="header-table">
            <tr>
                <td style="width: 25%;"><img id="logoImg" src="logo-elecnor.png" class="logo-img"></td>
                <td style="width: 50%;">Formulario de reporte de cuasi accidente<br>Copiapó Solar</td>
                <td style="width: 25%; color: #0088cc;">HSS&S</td>
            </tr>
        </table>
        <div class="section-header">1. CONTEXTO</div>
        <div class="row">
            <div class="cell"><label>FECHA:</label><input type="date" id="fecha" required></div>
            <div class="cell"><label>HORA:</label><input type="time" id="hora" required></div>
        </div>
        <div class="row">
            <div class="cell" style="flex: 1.5;"><label>DEPARTAMENTO:</label>
                <select id="depto" required>
                    <option value="">Seleccione...</option>
                    <option value="ADM/RRHH">ADM/RRHH</option>
                    <option value="CALIDAD">CALIDAD</option>
                    <option value="CIVIL">CIVIL</option>
                    <option value="ELECTRICA">ELECTRICA</option>
                    <option value="H&S">H&S</option>
                    <option value="LOGISTICA">LOGISTICA</option>
                </select>
            </div>
            <div class="cell" style="flex: 2;"><label>ÁREA ESPECÍFICA:</label>
                <div class="area-grid">
                    <label class="check-item"><input type="checkbox" name="area" value="IIFF"> IIFF</label>
                    <label class="check-item"><input type="checkbox" name="area" value="PV"> PV</label>
                    <label class="check-item"><input type="checkbox" name="area" value="BESS"> BESS</label>
                    <label class="check-item"><input type="checkbox" name="area" value="LAT"> LAT</label>
                    <label class="check-item"><input type="checkbox" name="area" value="SE C.P"> SE C.P</label>
                    <label class="check-item"><input type="checkbox" name="area" value="SE ELE"> SE ELE</label>
                </div>
            </div>
        </div>
        <div class="section-header">2. DESCRIPCIÓN DO EVENTO</div>
        <div class="row"><div class="cell"><textarea id="desc" rows="3" placeholder="¿Qué passou?" required></textarea></div></div>
        <div class="section-header">3. REGISTRO FOTOGRÁFICO</div>
        <div class="photo-upload" onclick="document.getElementById('foto').click()">
            <label style="cursor:pointer">📸 Toque para capturar foto</label>
            <input type="file" id="foto" accept="image/*" style="display:none;">
            <img id="preview">
        </div>
        <div class="section-header">4. IDENTIFICACIÓN</div>
        <div class="row">
            <div class="cell"><label>RELATOR:</label><input type="text" id="relator" placeholder="Opcional"></div>
            <div class="cell"><label>SUPERVISOR:</label><input type="text" id="supervisor" required></div>
        </div>
        <button type="submit" class="btn-submit">GERAR RELATÓRIO PDF</button>
    </form>
</div>

<script>
    const fotoInput = document.getElementById('foto');
    const preview = document.getElementById('preview');
    fotoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
            reader.readAsDataURL(file);
        }
    });

    async function getLogoBase64(url) {
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        } catch (e) { return null; }
    }

    document.getElementById('hSEForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');

        const logoBase64 = await getLogoBase64('logo-elecnor.png');
        if (logoBase64) doc.addImage(logoBase64, 'PNG', 12, 12, 35, 15);

        doc.setLineWidth(0.4);
        doc.rect(10, 10, 190, 25); 
        doc.line(60, 10, 60, 35); doc.line(150, 10, 150, 35);
        doc.setFontSize(10); doc.setFont("helvetica", "bold");
        doc.text("Formulario de reporte de cuasi accidente", 105, 20, { align: 'center' });
        doc.text("Copiapó Solar", 105, 27, { align: 'center' });
        doc.setTextColor(0, 136, 204); doc.text("HSS&S", 175, 23, { align: 'center' });
        
        doc.setTextColor(0); doc.setFillColor(203, 213, 224);
        doc.rect(10, 35, 190, 7, 'F'); doc.rect(10, 35, 190, 7);
        doc.setFontSize(9); doc.text("1. CONTEXTO", 15, 40);
        doc.rect(10, 42, 190, 22); doc.line(10, 53, 200, 53); doc.line(105, 42, 105, 53);
        doc.setFontSize(8); doc.setFont("helvetica", "normal");
        doc.text("FECHA: " + document.getElementById('fecha').value, 12, 49);
        doc.text("HORA: " + document.getElementById('hora').value, 107, 49);
        doc.text("DEPTO: " + document.getElementById('depto').value, 12, 60);
        const areas = Array.from(document.querySelectorAll('input[name="area"]:checked')).map(cb => cb.value).join(', ');
        doc.text("ÁREAS: " + areas, 107, 60);

        doc.setFont("helvetica", "bold"); doc.setFillColor(203, 213, 224);
        doc.rect(10, 64, 190, 7, 'F'); doc.rect(10, 64, 190, 7);
        doc.text("2. DESCRIPCIÓN", 15, 69);
        doc.rect(10, 71, 190, 30); doc.setFont("helvetica", "normal");
        doc.text(doc.splitTextToSize(document.getElementById('desc').value, 180), 12, 77);

        doc.setFont("helvetica", "bold"); doc.setFillColor(203, 213, 224);
        doc.rect(10, 101, 190, 7, 'F'); doc.rect(10, 101, 190, 7);
        doc.text("4. IDENTIFICACIÓN", 15, 106);
        doc.rect(10, 108, 190, 12); doc.line(105, 108, 105, 120);
        doc.setFont("helvetica", "normal");
        doc.text("NARRADOR: " + (document.getElementById('relator').value || "N/A"), 12, 115);
        doc.text("SUPERVISOR: " + document.getElementById('supervisor').value, 107, 115);

        doc.setFont("helvetica", "bold"); doc.setFillColor(203, 213, 224);
        doc.rect(10, 120, 190, 7, 'F'); doc.rect(10, 120, 190, 7);
        doc.text("3. REGISTRO FOTOGRÁFICO", 15, 125);
        doc.rect(10, 127, 190, 110); 
        if (preview.style.display === 'block') {
            doc.addImage(preview.src, 'JPEG', 20, 132, 170, 100);
        }
        doc.save(`Reporte_Elecnor_${document.getElementById('fecha').value}.pdf`);
    });

    // --- SERVICE WORKER E PROMPT DE INSTALAÇÃO ---
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installMsg = document.createElement('div');
        installMsg.style = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--blue); color:white; padding:15px; border-radius:8px; z-index:1000; text-align:center; box-shadow:0 4px 15px rgba(0,0,0,0.4); width:90%;";
        installMsg.innerHTML = "<strong>¿Instalar App Elecnor?</strong><br><small>Para uso rápido y offline</small><br><button id='btnInstall' style='margin-top:10px; padding:8px 20px; border:none; border-radius:5px; background:white; color:var(--blue); font-weight:bold;'>INSTALAR AHORA</button>";
        document.body.appendChild(installMsg);
        document.getElementById('btnInstall').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                installMsg.remove();
            }
        });
    });
</script>
</body>
</html>
