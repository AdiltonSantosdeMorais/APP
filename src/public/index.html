<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPORTE DE INCIDENTE - ELECNOR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f9; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; border-top: 5px solid #003366; text-align: center; }
        .logo { width: 180px; margin-bottom: 20px; }
        h2 { color: #003366; font-size: 18px; text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { text-align: left; margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: bold; color: #444; margin-bottom: 5px; }
        input, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { background-color: #003366; color: white; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 16px; }
        button:hover { background-color: #002244; }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo-elecnor.png" alt="Elecnor" class="logo">
        <h2>REPORTE CUASI ACCIDENTE / CONDICIÓN INSEGURA</h2>
        
        <form id="relatoForm">
            <div class="form-group">
                <label for="fecha">Fecha y Hora</label>
                <input type="datetime-local" id="fecha" name="fecha" required>
            </div>
            <div class="form-group">
                <label for="unidad">Unidad / Localización</label>
                <input type="text" id="unidad" name="unidad" required>
            </div>
            <div class="form-group">
                <label for="descripcion">Descripción del Riesgo</label>
                <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="foto">Anexar Foto de Evidencia</label>
                <input type="file" id="foto" accept="image/*">
            </div>
            <div class="form-group">
                <label for="nombre">Nombre del Relator (Obrigatório)</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <button type="submit">GERAR REPORTE E BAIXAR PDF</button>
        </form>
    </div>

    <script>
        document.getElementById('relatoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const nombre = document.getElementById('nombre').value;
            const fecha = document.getElementById('fecha').value;
            const unidad = document.getElementById('unidad').value;
            const desc = document.getElementById('descripcion').value;
            const fotoInput = document.getElementById('foto');

            // Configuração do PDF
            doc.setFontSize(20);
            doc.setTextColor(0, 51, 102);
            doc.text("REPORTE DE INCIDENTE", 105, 20, { align: 'center' });
            
            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0);
            doc.text(`Relator: ${nombre}`, 20, 40);
            doc.text(`Fecha/Hora: ${fecha}`, 20, 50);
            doc.text(`Unidad: ${unidad}`, 20, 60);
            doc.text("Descripción:", 20, 80);
            doc.setFontSize(10);
            doc.text(desc, 20, 90, { maxWidth: 170 });

            // Lógica para incluir a FOTO no PDF se ela existir
            if (fotoInput.files && fotoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgData = event.target.result;
                    // Adiciona a imagem no PDF (X, Y, Largura, Altura)
                    doc.addImage(imgData, 'JPEG', 20, 120, 80, 60);
                    finalizarPDF();
                };
                reader.readAsDataURL(fotoInput.files[0]);
            } else {
                finalizarPDF();
            }

            function finalizarPDF() {
                doc.save(`Reporte_Elecnor_${unidad}.pdf`);
                alert("✅ Reporte registrado e PDF baixado!");
                e.target.reset();
            }
        });
    </script>
</body>
</html>
