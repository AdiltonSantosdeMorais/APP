<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relato de Segurança - Elecnor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="logo-elecnor.png" alt="Logo Elecnor" class="logo">
        <h1>Relato de Incidencias</h1>
        
        <form id="relatoForm">
            <div class="form-group">
                <label for="nombre">Nombre del Relator:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre completo" required>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción del Incidente:</label>
                <textarea id="descripcion" name="descripcion" rows="4" placeholder="Describa lo ocurrido..." required></textarea>
            </div>

            <button type="submit">Enviar Reporte</button>
        </form>
    </div>

    <script>
        document.getElementById('relatoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                nombre: document.getElementById('nombre').value,
                fecha: document.getElementById('fecha').value,
                descripcion: document.getElementById('descripcion').value
            };

            const response = await fetch('/enviar-relato', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();
            alert(result.mensagem);
            if(response.ok) document.getElementById('relatoForm').reset();
        });
    </script>
</body>
</html>
