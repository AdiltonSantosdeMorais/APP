<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSE ELECNOR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; margin:0; background:#f0f2f5; }
.app-container { max-width:800px; margin:auto; background:white; }

.section-header { background:#cbd5e0; padding:10px; font-weight:bold; }
.row { display:flex; flex-wrap:wrap; border-bottom:1px solid #000; }
.cell { flex:1; padding:10px; min-width:150px; }

input, textarea, select { width:100%; border:none; font-size:14px; }

.photo-upload { padding:20px; text-align:center; }
.paint-btn { padding:12px; border:none; margin:5px; width:100%; }

#preview { width:100%; max-height:300px; display:none; margin-top:10px; }

#drawing-container {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:black;
    flex-direction:column;
}

#canvas { background:white; flex:1; }

</style>
</head>

<body>

<div class="app-container">
<form id="form">

<div class="section-header">1. CONTEXTO</div>
<div class="row">
<div class="cell"><input type="date" id="fecha" required></div>
<div class="cell"><input type="time" id="hora" required></div>
</div>

<div class="section-header">2. DESCRIPCIÓN</div>
<textarea id="desc" rows="4" required></textarea>

<div class="section-header">3. FOTO / DESENHO</div>

<div class="photo-upload">

<button type="button" id="btnFoto" class="paint-btn" style="background:#003366;color:white;">
📸 ANEXAR FOTO
</button>

<button type="button" id="btnDraw" class="paint-btn" style="background:#555;color:white;">
✏️ DESENHAR
</button>

<input type="file" id="foto" accept="image/*" style="display:none;">
<img id="preview">

</div>

<div class="section-header">4. IDENTIFICACIÓN</div>
<div class="row">
<div class="cell"><input type="text" id="nombre" placeholder="Nombre" required></div>
<div class="cell"><input type="text" id="empresa" placeholder="Empresa" required></div>
</div>

<button type="submit" style="width:100%;padding:20px;background:#003366;color:white;">
ENVIAR
</button>

</form>
</div>

<div id="drawing-container">
<canvas id="canvas"></canvas>

<div style="background:#333;padding:10px;text-align:center;">
<button id="cancel" style="background:red;color:white;padding:10px;">CANCELAR</button>
<button id="save" style="background:green;color:white;padding:10px;">GUARDAR</button>
</div>
</div>

<script>

const GOOGLE_SCRIPT_URL = "SEU_SCRIPT_AQUI";

// ELEMENTOS
const fotoInput = document.getElementById("foto");
const preview = document.getElementById("preview");
const btnFoto = document.getElementById("btnFoto");
const btnDraw = document.getElementById("btnDraw");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const drawContainer = document.getElementById("drawing-container");

let drawing = false;

// FOTO
btnFoto.onclick = () => fotoInput.click();

fotoInput.addEventListener("change", e => {
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = ev => {
        preview.src = ev.target.result;
        preview.style.display = "block";
    };

    if (file) reader.readAsDataURL(file);
});

// DESENHO
btnDraw.onclick = () => {
    drawContainer.style.display = "flex";

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.8;

    ctx.fillStyle = "white";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = "red";
    ctx.lineWidth = 3;
};

canvas.addEventListener("mousedown", () => drawing = true);
canvas.addEventListener("mouseup", () => {
    drawing = false;
    ctx.beginPath();
});

canvas.addEventListener("mousemove", draw);

function draw(e){
    if(!drawing) return;

    ctx.lineTo(e.clientX, e.clientY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.clientX, e.clientY);
}

// TOUCH
canvas.addEventListener("touchstart", () => drawing = true);
canvas.addEventListener("touchend", () => {
    drawing = false;
    ctx.beginPath();
});

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    draw(e.touches[0]);
});

// BOTÕES
document.getElementById("cancel").onclick = () => {
    drawContainer.style.display = "none";
};

document.getElementById("save").onclick = () => {
    preview.src = canvas.toDataURL("image/jpeg",0.7);
    preview.style.display = "block";
    drawContainer.style.display = "none";
};

// PDF + ENVIO
document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.text("REPORTE HSE", 20, 20);
    doc.text(document.getElementById("desc").value, 20, 40);

    if(preview.src){
        doc.addImage(preview.src, "JPEG", 20, 60, 150, 100);
    }

    const pdf = doc.output("datauristring").split(",")[1];

    fetch(GOOGLE_SCRIPT_URL, {
        method:"POST",
        mode:"no-cors",
        body: JSON.stringify({file: pdf})
    });

    doc.save("reporte.pdf");
});

</script>

</body>
</html>
