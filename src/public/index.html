<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSE Elecnor - Copiapó Solar</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --blue: #003366; --gray: #cbd5e0; --light-gray: #f0f2f5; }
        body { font-family: Arial, sans-serif; background: var(--light-gray); margin: 0; padding: 0; width: 100%; }
        .app-container { background: white; width: 100%; max-width: 800px; margin: 0 auto; min-height: 100vh; border: 1px solid #000; box-sizing: border-box; display: flex; flex-direction: column; }
        
        /* Encabezado */
        .header-table { width: 100%; border-collapse: collapse; }
        .header-table td { border: 1px solid #000; text-align: center; padding: 5px; font-weight: bold; font-size: 11px; }
        .logo-img { width: 80px; height: auto; }
        
        /* Secciones del Formulario */
        .section-header { background: var(--gray); border: 1px solid #000; padding: 8px 10px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .row { display: flex; border-bottom: 1px solid #000; width: 100%; flex-wrap: wrap; }
        .cell { border-right: 1px solid #000; padding: 10px; display: flex; flex-direction: column; flex: 1; min-width: 140px; box-sizing: border-box; }
        .cell:last-child { border-right: none; }
        
        label { font-size: 10px; font-weight: bold; margin-bottom: 4px; color: var(--blue); text-transform: uppercase; }
        input, textarea, select { border: none; outline: none; font-size: 14px; background: transparent; width: 100%; font-family: inherit; }
        
        /* Grid de Selección de Área */
        .area-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 5px; width: 100%; padding: 5px 0; }
        .check-item { display: flex; align-items: center; font-size: 10px; font-weight: bold; }
        .check-item input { width: auto; margin-right: 5px; }
        
        /* Registro Fotográfico */
        .photo-upload { padding: 15px; border: 2px dashed var(--gray); margin: 10px; text-align: center; cursor: pointer; border-radius: 4px; }
        #preview { width: 100%; max-height: 200px; object-fit: contain; display: none; margin-top: 10px; }
        
        /* Botón de Envío */
        .btn-submit { background: var(--blue); color: white; border: none; padding: 20px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; margin-top: auto; }
        #statusMsg { font-size: 12px; text-align: center; padding: 10px; display: none; font-weight: bold; }
        
        @media (max-width: 480px) { .cell { min-width: 100%; border-right: none; border-bottom: 1px solid #000; } }
    </style>
</head>
<body>
<div class="app-container">
    <form id="hSEForm">
        <table class="header-table">
            <tr>
                <td style="width: 25%;"><img id="logoImg" src="logo-elecnor.png" class="logo-img"></td>
                <td style="width: 50%;">Formulario de reporte de cuasi accidente<br>Copiapó Solar</td>
                <td style="width: 25%; color: #0088cc;">HSS&S</td>
            </tr>
        </table>
        
        <div class="section-header">1. CONTEXTO</div>
        <div class="row">
            <div class="cell"><label>FECHA:</label><input type="date" id="fecha" required></div>
            <div class="cell"><label>HORA:</label><input type="time" id="hora" required></div>
        </div>
        <div class="row">
            <div class="cell" style="flex: 1.5;"><label>DEPARTAMENTO:</label>
                <select id="depto" required>
                    <option value="">Seleccione...</option>
                    <option value="ADM/RRHH">ADM/RRHH</option>
                    <option value="CALIDAD">CALIDAD</option>
                    <option value="CIVIL">CIVIL</option>
                    <option value="ELECTRICA">ELECTRICA</option>
                    <option value="H&S">H&S</option>
                    <option value="LOGISTICA">LOGISTICA</option>
                </select>
            </div>
            <div class="cell" style="flex: 2;"><label>ÁREA ESPECÍFICA:</label>
                <div class="area-grid">
                    <label class="check-item"><input type="checkbox" name="area" value="IIFF"> IIFF</label>
                    <label class="check-item"><input type="checkbox" name="area" value="PV"> PV</label>
                    <label class="check-item"><input type="checkbox" name="area" value="BESS"> BESS</label>
                    <label class="check-item"><input type="checkbox" name="area" value="LAT"> LAT</label>
                    <label class="check-item"><input type="checkbox" name="area" value="SE C.P"> SE C.P</label>
                    <label class="check-item"><input type="checkbox" name="area" value="SE ELE"> SE ELE</label>
                </div>
            </div>
        </div>

        <div class="section-header">2. DESCRIPCIÓN DEL EVENTO</div>
        <div class="row"><div class="cell"><textarea id="desc" rows="4" placeholder="Describa lo que sucedió..." required></textarea></div></div>

        <div class="section-header">3. REGISTRO FOTOGRÁFICO</div>
        <div class="photo-upload" onclick="document.getElementById('foto').click()">
            <label style="cursor:pointer">📸 Capturar o Seleccionar Foto</label>
            <input type="file" id="foto" accept="image/*" style="display:none;">
            <img id="preview">
        </div>

        <div class="section-header">4. IDENTIFICACIÓN</div>
        <div class="row">
            <div class="cell"><label>RELATOR:</label><input type="text" id="relator" placeholder="Nombre (Opcional)"></div>
            <div class="cell"><label>SUPERVISOR:</label><input type="text" id="supervisor" required placeholder="Nombre del supervisor"></div>
        </div>

        <div id="statusMsg"></div>
        <button type="submit" id="submitBtn" class="btn-submit">ENVIAR E GERAR PDF</button>
    </form>
</div>

<script>
    // URL DE TU SCRIPT ACTUALIZADA
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwpvovV6jGu_7lazLY3HfvCaBxVPOUjtLKHNjmBuKEGyM5QIxrEIgeo9kq5DPZRyEePJg/exec';

    const fotoInput = document.getElementById('foto');
    const preview = document.getElementById('preview');

    fotoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
            reader.readAsDataURL(file);
        }
    });

    async function getLogoBase64(url) {
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        } catch (e) { return null; }
    }

    document.getElementById('hSEForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusMsg');
        
        btn.disabled = true;
        btn.innerText = "ENVIANDO...";
        status.style.display = "block";
        status.innerText = "⏳ Generando PDF A4 idêntico...";

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');

        const grayColor = [203, 213, 224];
        const blueLabel = [0, 51, 102];

        // --- DIBUJO DEL PDF ---
        doc.setLineWidth(0.5);
        doc.rect(10, 10, 190, 25); // Marco Encabezado
        doc.line(60, 10, 60, 35); doc.line(150, 10, 150, 35);
        
        const logoBase64 = await getLogoBase64('logo-elecnor.png');
        if (logoBase64) doc.addImage(logoBase64, 'PNG', 12, 12, 35, 15);

        doc.setFontSize(11); doc.setFont("helvetica", "bold");
        doc.text("Formulario de reporte de cuasi accidente", 105, 20, { align: 'center' });
        doc.text("Copiapó Solar", 105, 27, { align: 'center' });
        doc.setTextColor(0, 136, 204); doc.text("HSS&S", 175, 23, { align: 'center' });
        doc.setTextColor(0);

        // 1. Contexto
        doc.setFillColor(...grayColor);
        doc.rect(10, 35, 190, 7, 'F'); doc.rect(10, 35, 190, 7);
        doc.setFontSize(9); doc.text("1. CONTEXTO", 12, 40);
        doc.rect(10, 42, 190, 12); doc.line(105, 42, 105, 54);
        doc.setFontSize(7); doc.setTextColor(...blueLabel);
        doc.text("FECHA:", 12, 46); doc.text("HORA:", 107, 46);
        doc.setFontSize(10); doc.setTextColor(0);
        doc.text(document.getElementById('fecha').value, 12, 51);
        doc.text(document.getElementById('hora').value, 107, 51);

        doc.rect(10, 54, 190, 12); doc.line(80, 54, 80, 66);
        doc.setFontSize(7); doc.setTextColor(...blueLabel);
        doc.text("DEPARTAMENTO:", 12, 58); doc.text("ÁREA ESPECÍFICA:", 82, 58);
        doc.setFontSize(9); doc.setTextColor(0);
        doc.text(document.getElementById('depto').value, 12, 63);
        const areas = Array.from(document.querySelectorAll('input[name="area"]:checked')).map(cb => cb.value).join(', ');
        doc.text(areas, 82, 63);

        // 2. Descripción
        doc.setFillColor(...grayColor);
        doc.rect(10, 66, 190, 7, 'F'); doc.rect(10, 66, 190, 7);
        doc.setFontSize(9); doc.setFont("helvetica", "bold"); doc.text("2. DESCRIPCIÓN DO EVENTO", 12, 71);
        doc.rect(10, 73, 190, 35);
        doc.setFont("helvetica", "normal"); doc.setFontSize(10);
        const descText = doc.splitTextToSize(document.getElementById('desc').value, 180);
        doc.text(descText, 12, 80);

        // 3. Foto (Con Compresión)
        doc.setFillColor(...grayColor);
        doc.rect(10, 108, 190, 7, 'F'); doc.rect(10, 108, 190, 7);
        doc.setFont("helvetica", "bold"); doc.text("3. REGISTRO FOTOGRÁFICO", 12, 113);
        doc.rect(10, 115, 190, 105);
        if (preview.style.display === 'block') {
            const canvas = document.createElement('canvas');
            const img = new Image();
            img.src = preview.src;
            await new Promise(r => img.onload = r);
            const scale = 800 / img.width;
            canvas.width = 800; canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            doc.addImage(canvas.toDataURL('image/jpeg', 0.7), 'JPEG', 15, 120, 180, 95);
        }

        // 4. Identificación
        doc.setFillColor(...grayColor);
        doc.rect(10, 220, 190, 7, 'F'); doc.rect(10, 220, 190, 7);
        doc.text("4. IDENTIFICACIÓN", 12, 225);
        doc.rect(10, 227, 190, 15); doc.line(105, 227, 105, 242);
        doc.setFontSize(7); doc.setTextColor(...blueLabel);
        doc.text("RELATOR:", 12, 231); doc.text("SUPERVISOR:", 107, 231);
        doc.setFontSize(10); doc.setTextColor(0);
        doc.text(document.getElementById('relator').value || "N/A", 12, 239);
        doc.text(document.getElementById('supervisor').value, 107, 239);

        // --- PROCESO DE ENVÍO ---
        const pdfBase64 = doc.output('datauristring').split(',')[1];
        const payload = JSON.stringify({
            name: `Reporte_HSE_${document.getElementById('fecha').value}_${Date.now()}.pdf`,
            bytes: pdfBase64
        });

        try {
            await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: payload });
            status.innerText = "✅ ¡Enviado al Drive y generado con éxito!";
            status.style.color = "green";
            doc.save(`Reporte_Elecnor_${document.getElementById('fecha').value}.pdf`);
        } catch (err) {
            status.innerText = "❌ Error al enviar. Guardado localmente.";
            status.style.color = "red";
            doc.save(`Reporte_Backup.pdf`);
        }

        btn.disabled = false;
        btn.innerText = "ENVIAR E GERAR PDF";
    });

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
</script>
</body>
</html>
