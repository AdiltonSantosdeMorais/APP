<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Elecnor - Copiapó Solar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --blue: #003366; --gray: #cbd5e0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 10px; display: flex; justify-content: center; }
        .app-container { background: white; width: 100%; max-width: 800px; border: 2px solid #000; box-sizing: border-box; }
        .header-table { width: 100%; border-collapse: collapse; }
        .header-table td { border: 1px solid #000; text-align: center; padding: 8px; font-weight: bold; font-size: 13px; }
        .section-header { background: var(--gray); border: 1px solid #000; padding: 5px 10px; font-weight: bold; font-size: 12px; }
        .row { display: flex; border-bottom: 1px solid #000; width: 100%; flex-wrap: wrap; }
        .cell { border-right: 1px solid #000; padding: 8px; display: flex; flex-direction: column; flex: 1; min-width: 120px; }
        .cell:last-child { border-right: none; }
        label { font-size: 10px; font-weight: bold; margin-bottom: 3px; color: var(--blue); }
        input, textarea, select { border: none; outline: none; font-size: 14px; background: transparent; width: 100%; }

        /* Grade de Checkboxes das Áreas */
        .area-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 5px; }
        .check-item { display: flex; align-items: center; font-size: 10px; font-weight: bold; }
        .check-item input { width: auto; margin-right: 5px; }

        button { background: var(--blue); color: white; border: none; padding: 20px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; border-top: 2px solid #000; }
    </style>
</head>
<body>

<div class="app-container">
    <form id="hSEForm">
        <table class="header-table">
            <tr>
                <td style="width: 25%;"><img src="logo-elecnor.png" width="100"></td>
                <td style="width: 50%;">Formulario de Reporte de Cuasi Accidente<br>Copiapó Solar</td>
                <td style="width: 25%; color: #0088cc;">HSS&S</td>
            </tr>
        </table>

        <div class="section-header">1. ANTECEDENTES</div>
        <div class="row">
            <div class="cell"><label>FECHA:</label><input type="date" id="fecha" required></div>
            <div class="cell"><label>HORA:</label><input type="time" id="hora" required></div>
        </div>
        <div class="row">
            <div class="cell" style="flex: 2;">
                <label>DEPARTAMENTO / ÁREA:</label>
                <select id="departamento" required>
                    <option value="">Seleccione...</option>
                    <option value="H&S">H&S</option>
                    <option value="ADM/RRHH">ADM/RRHH</option>
                    <option value="CALIDAD">CALIDAD</option>
                    <option value="CIVIL">CIVIL</option>
                    <option value="ELECTRICA">ELECTRICA</option>
                    <option value="INGENIERIA">INGENIERIA</option>
                    <option value="FLOTA">FLOTA</option>
                    <option value="LOGISTICA">LOGISTICA</option>
                    <option value="MEDIO AMBIENTE">MEDIO AMBIENTE</option>
                    <option value="ANONIMO">ANONIMO</option>
                </select>
            </div>
            <div class="cell" style="flex: 3;">
                <label>ÁREA ESPECÍFICA (Checkboxes):</label>
                <div class="area-grid">
                    <div class="check-item"><input type="checkbox" name="area" value="IIFF"> IIFF</div>
                    <div class="check-item"><input type="checkbox" name="area" value="PV"> PV</div>
                    <div class="check-item"><input type="checkbox" name="area" value="BESS"> BESS</div>
                    <div class="check-item"><input type="checkbox" name="area" value="LAT"> LAT</div>
                    <div class="check-item"><input type="checkbox" name="area" value="SEC.P"> SE C.P</div>
                    <div class="check-item"><input type="checkbox" name="area" value="SEELE"> SE ELE</div>
                    <div class="check-item"><input type="checkbox" name="area" value="OT"> OT</div>
                </div>
            </div>
        </div>

        <div class="section-header">2. DESCRIPCIÓN DO EVENTO</div>
        <div class="row">
            <div class="cell"><textarea id="descripcion" rows="5" placeholder="O que aconteceu? O que evitou o acidente?" required></textarea></div>
        </div>

        <div class="section-header">3. IDENTIFICACIÓN</div>
        <div class="row">
            <div class="cell"><label>RELATOR:</label><input type="text" id="relator" placeholder="Nombre (Opcional)"></div>
            <div class="cell"><label>SUPERVISOR:</label><input type="text" id="supervisor" required></div>
        </div>

        <button type="submit">GERAR RELATÓRIO TÉCNICO PDF</button>
    </form>
</div>

<script>
    document.getElementById('hSEForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Reporte Elecnor - Copiapó Solar", 10, 10);
        doc.text("Fecha: " + document.getElementById('fecha').value, 10, 20);
        doc.text("Depto: " + document.getElementById('departamento').value, 10, 30);
        doc.save("Reporte.pdf");
        alert("PDF Gerado!");
    });
</script>
</body>
</html>
