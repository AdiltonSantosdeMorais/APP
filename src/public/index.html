<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elecnor Chile - Reporte</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        .logo { width: 200px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #0056b3; color: white; border: none; padding: 10px 20px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <img src="logo-elecnor.png" alt="Elecnor" class="logo">
    <h2>Relatório de Incidente</h2>
    
    <form id="relatoForm">
        <div class="form-group">
            <label for="nombre">Nombre del Relator:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre completo" required>
        </div>

        <div class="form-group">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" required>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción del incidente:</label>
            <textarea id="descripcion" name="descripcion" rows="4" required placeholder="Descreva o que aconteceu..."></textarea>
        </div>

        <button type="submit">Enviar relatório</button>
    </form>

    <script>
        document.getElementById('relatoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                nombre: document.getElementById('nombre').value,
                fecha: document.getElementById('fecha').value,
                descripcion: document.getElementById('descripcion').value
            };

            const response = await fetch('/enviar-relato', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();
            alert(result.mensagem);
            if(response.ok) document.getElementById('relatoForm').reset();
        });
    </script>
</body>
</html>
